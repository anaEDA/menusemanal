<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Menú & Stock Mobile</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #666666;
      --border-color: #e2e8f0;
      --danger: #d32f2f;
      --stock-bg: #e8f5e9;
      --stock-text: #2e7d32;
      --falta-bg: #ffebee;
      --falta-text: #c62828;
      --wsp-color: #25d366;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: env(safe-area-inset-top, 10px) 8px env(safe-area-inset-bottom, 10px) 8px;
      display: flex;
      justify-content: center;
    }

    .main-app {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .main-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .main-nav-btn {
      flex: 1;
      padding: 8px 4px;
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .main-nav-btn.active {
      background: var(--primary);
      color: white;
    }

    .panel-container {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: none;
    }

    .panel-container.active {
      display: block;
    }

    .panel-container h2 {
      margin: 0 0 10px 0;
      color: var(--text-main);
      font-size: 1.05rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .btn-action {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    .btn-wsp { background: var(--wsp-color); }
    .btn-secondary { background: #edf2f7; color: #2d3748; }

    .add-meal-box {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .add-meal-box h3 {
      margin: 0 0 8px 0;
      font-size: 0.85rem;
      color: var(--primary);
    }

    .add-meal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .add-meal-grid input, .add-meal-grid select {
      padding: 6px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.75rem;
      background: white;
      outline: none;
    }

    .input-full {
      grid-column: span 2;
    }

    .menu-day-row {
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .menu-day-row label {
      font-weight: bold;
      font-size: 0.75rem;
      color: var(--primary);
      display: block;
      margin-bottom: 2px;
    }

    .menu-inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .menu-inputs-grid input {
      padding: 5px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.75rem;
      background: #fff;
    }

    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 2px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.7rem;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .form-row {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
    }

    .form-control {
      padding: 6px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.8rem;
      outline: none;
      background: white;
    }

    .item-list { list-style: none; padding: 0; margin: 0; }

    .section-header-tag {
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--primary);
      background: #e8f5e9;
      padding: 4px 8px;
      border-radius: 4px;
      margin: 8px 0 4px 0;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.8rem;
    }

    .item-left { display: flex; align-items: center; gap: 6px; }
    .item-left input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; }

    .item-right { display: flex; align-items: center; gap: 4px; }

    .badge {
      font-size: 0.6rem;
      padding: 2px 4px;
      border-radius: 8px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-stock { background-color: var(--stock-bg); color: var(--stock-text); }
    .badge-falta { background-color: var(--falta-bg); color: var(--falta-text); }

    .btn-delete { background: none; border: none; color: #cbd5e0; cursor: pointer; font-size: 0.85rem; }
    .btn-delete:hover { color: var(--danger); }

    .export-box { display: flex; gap: 4px; margin-top: 10px; }
  </style>
</head>
<body>

  <main class="main-app">

    <nav class="main-nav">
      <button class="main-nav-btn active" onclick="cambiarSeccion('menu', event)">🍽️ Menú Semanal</button>
      <button class="main-nav-btn" onclick="cambiarSeccion('stock', event)">🛒 Stock y Súper</button>
    </nav>

    <!-- SECCIÓN 1: Menú Semanal -->
    <section id="sec-menu" class="panel-container active">
      
      <!-- Panel de Añadir / Editar Comida -->
      <div class="add-meal-box">
        <h3>➕ Añadir / Editar Comida</h3>
        <div class="add-meal-grid">
          <input type="text" id="custom-comida-input" class="input-full" placeholder="Nombre de la comida...">
          <select id="custom-dia-select">
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sábado">Sábado</option>
            <option value="Domingo">Domingo</option>
          </select>
          <select id="custom-momento-select">
            <option value="almuerzo">Almuerzo (Izq.)</option>
            <option value="cena">Cena (Der.)</option>
          </select>
        </div>
        <button class="btn-action" onclick="asignarComidaManual()" style="margin:0;">Asignar al Menú</button>
      </div>

      <div style="display: flex; justify-content: center; margin-bottom: 12px;">
        <button class="btn-action btn-secondary" onclick="generarMenuAutomatico()" style="max-width: 280px; width: 100%;">
          ⚡ Generar Menú Aleatorio
        </button>
      </div>

      <div id="menu-semanal-container"></div>

      <div class="export-box" style="flex-direction: column; gap: 6px; margin-top: 12px;">
        <button class="btn-action btn-secondary" onclick="verificarYcargarFaltantes()" style="margin: 0;">
          🛒 Cargar Faltantes a la Lista
        </button>
        <div style="display: flex; gap: 6px;">
          <button class="btn-action btn-wsp" onclick="compartirPorWhatsApp()" style="margin: 0;">📲 WhatsApp</button>
          <button class="btn-action btn-secondary" onclick="copiarMenuAlPortapapeles()" style="margin: 0;">📋 Copiar</button>
        </div>
      </div>
    </section>

    <!-- SECCIÓN 2: Stock y Súper -->
    <section id="sec-stock" class="panel-container">
      <h2>Stock y Súper</h2>

      <div class="tabs">
        <button class="tab-btn active" onclick="filtrarLista('todos', event)">Todos</button>
        <button class="tab-btn" onclick="filtrarLista('stock-alimentos', event)">Stock Alim.</button>
        <button class="tab-btn" onclick="filtrarLista('stock-productos', event)">Stock Prod.</button>
        <button class="tab-btn" onclick="filtrarLista('falta', event)">🛒 Falta</button>
      </div>

      <div class="form-row" style="margin-bottom: 8px;">
        <input type="text" id="nuevo-item-input" class="form-control" placeholder="Agregar item..." style="flex: 2;" onkeypress="handleKeyPress(event)">
        <select id="nuevo-item-tipo" class="form-control" style="flex: 1;">
          <option value="alimento">Alimento</option>
          <option value="producto">Producto</option>
        </select>
        <button onclick="agregarItemManual()" class="btn-action" style="width: auto; margin:0;">+</button>
      </div>

      <div id="inventario-lista-container"></div>
    </section>

  </main>

  <script>
    const diasSemana = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

    const catalogoComidas = [
      { nombre: "Milanesas con puré", ingredientes: ["Carne", "Pan rallado", "Papa", "Leche", "Huevo"] },
      { nombre: "Fideos con salsa de tomate", ingredientes: ["Fideos", "Salsa de tomate", "Queso rallado"] },
      { nombre: "Arroz con lomito y huevo", ingredientes: ["Arroz", "Lomito", "Huevo", "Mayonesa"] },
      { nombre: "Omelette con queso y tomate", ingredientes: ["Huevo", "Queso", "Tomate"] },
      { nombre: "Pastel de fiambre", ingredientes: ["Masa de tarta", "Jamón", "Queso", "Huevo"] },
      { nombre: "Pollo al horno con papas", ingredientes: ["Pollo", "Papa", "Aceite"] },
      { nombre: "Guiso de fideos", ingredientes: ["Fideos", "Salsa de tomate", "Papa", "Pollo"] },
      { nombre: "Pollo,lechuga, tomate y pepino", ingredientes: ["Pollo", "Lechuga", "Tomate", "Pepino"] },
      { nombre: "Hamburguesas con ensalada", ingredientes: ["Hamburguesas", "Lechuga", "Tomate"] },
      { nombre: "Pizzetas con queso", ingredientes: ["Masa de pizza", "Salsa de tomate", "Queso"] },
      { nombre: "Tortilla de papa", ingredientes: ["Papa", "Huevo"] },
      { nombre: "Pollo crema con arroz", ingredientes: ["Pollo", "Arroz" , "Crema", "champiniones"] },
      { nombre: "Fideos tipo Ramen", ingredientes: ["Fideos Ramen"] },
      { nombre: "Fideos con Hamburguesas", ingredientes: ["Fideos" ,"Hamburguesas"] },
      { nombre: "Arroz con Hamburguesas", ingredientes: ["Arroz" ,"Hamburguesas"] },
      { nombre: "Arroz Frito con Hamburguesas", ingredientes: ["Arroz" ,"Hamburguesas", "Caldo"] },
      { nombre: "Guiso de arroz", ingredientes: ["Arroz", "Salsa de tomate", "Papa", "Pollo"] },
      { nombre: "Panchos", ingredientes: ["Panchos", "Pan de Viena"] },
      { nombre: "Arroz con panchos", ingredientes: ["Panchos", "Arroz"] },
      { nombre: "Hamburguesas al pan", ingredientes: ["Pan", "Hamburguesa"] },
      { nombre: "Milanesas al pan", ingredientes: ["Pan", "Milanesa"] }
    ];

    // Todos los ítems base inician marcados como FALTANTES (enStock: false)
    const listaBaseOriginal = [
      // ALIMENTOS
      { nombre: "Harina", tipo: "alimento", enStock: false },
      { nombre: "Aceite", tipo: "alimento", enStock: false },
      { nombre: "Aceite de oliva", tipo: "alimento", enStock: false },
      { nombre: "Fideos", tipo: "alimento", enStock: false },
      { nombre: "Arroz", tipo: "alimento", enStock: false },
      { nombre: "Levadura", tipo: "alimento", enStock: false },
      { nombre: "Sal", tipo: "alimento", enStock: false },
      { nombre: "Azúcar", tipo: "alimento", enStock: false },
      { nombre: "Galletas", tipo: "alimento", enStock: false },
      { nombre: "Barras de cereales", tipo: "alimento", enStock: false },
      { nombre: "Lomito", tipo: "alimento", enStock: false },
      { nombre: "Choclo", tipo: "alimento", enStock: false },
      { nombre: "Arvejas", tipo: "alimento", enStock: false },
      { nombre: "Café", tipo: "alimento", enStock: false },
      { nombre: "Salsa de tomate", tipo: "alimento", enStock: false },
      { nombre: "Royal", tipo: "alimento", enStock: false },
      { nombre: "Aderezos", tipo: "alimento", enStock: false },
      { nombre: "Yerba", tipo: "alimento", enStock: false },
      { nombre: "Puré", tipo: "alimento", enStock: false },
      { nombre: "Sopa", tipo: "alimento", enStock: false },
      { nombre: "Huevos", tipo: "alimento", enStock: false },
      { nombre: "Caldos", tipo: "alimento", enStock: false },
      { nombre: "Panchos", tipo: "alimento", enStock: false },
      { nombre: "Hamburguesas", tipo: "alimento", enStock: false },
      { nombre: "Fiambre", tipo: "alimento", enStock: false },
      { nombre: "Carne", tipo: "alimento", enStock: false },
      { nombre: "Pollo", tipo: "alimento", enStock: false },
      { nombre: "Yogurt", tipo: "alimento", enStock: false },
      { nombre: "Requesón", tipo: "alimento", enStock: false },
      { nombre: "Frutas", tipo: "alimento", enStock: false },
      { nombre: "Verduras", tipo: "alimento", enStock: false },
      { nombre: "Condimentos", tipo: "alimento", enStock: false },
      { nombre: "Granola", tipo: "alimento", enStock: false },
      { nombre: "Polenta", tipo: "alimento", enStock: false },
      { nombre: "Dulces/mermeladas", tipo: "alimento", enStock: false },
      { nombre: "Pan rallado", tipo: "alimento", enStock: false },
      { nombre: "Maicena", tipo: "alimento", enStock: false },
      { nombre: "Avena", tipo: "alimento", enStock: false },

      // PRODUCTOS DE LIMPIEZA E HIGIENE
      { nombre: "Pasta de dientes", tipo: "producto", enStock: false },
      { nombre: "Jabón de cuerpo", tipo: "producto", enStock: false },
      { nombre: "Shampoo", tipo: "producto", enStock: false },
      { nombre: "Acondicionador", tipo: "producto", enStock: false },
      { nombre: "Jabón de manos", tipo: "producto", enStock: false },
      { nombre: "Papel higienico", tipo: "producto", enStock: false },
      { nombre: "Olor de water", tipo: "producto", enStock: false },
      { nombre: "Talco", tipo: "producto", enStock: false },
      { nombre: "Adherentes", tipo: "producto", enStock: false },
      { nombre: "Glade", tipo: "producto", enStock: false },
      { nombre: "Fabuloso", tipo: "producto", enStock: false },
      { nombre: "Protectores", tipo: "producto", enStock: false },
      { nombre: "Enjuague bucal", tipo: "producto", enStock: false },
      { nombre: "Cotonetes", tipo: "producto", enStock: false },
      { nombre: "Pañuelos", tipo: "producto", enStock: false },
      { nombre: "Desodorante", tipo: "producto", enStock: false },
      { nombre: "Jabón de lavarropas", tipo: "producto", enStock: false },
      { nombre: "Suavizante", tipo: "producto", enStock: false },
      { nombre: "Tampones", tipo: "producto", enStock: false },
      { nombre: "Curitas", tipo: "producto", enStock: false },
      { nombre: "Alcohol", tipo: "producto", enStock: false },
      { nombre: "Jabón de loza", tipo: "producto", enStock: false },
      { nombre: "Cepillo de dientes", tipo: "producto", enStock: false },
      { nombre: "Bolsa de basura", tipo: "producto", enStock: false },
      { nombre: "Hilo dental", tipo: "producto", enStock: false },
      { nombre: "Medicamentos", tipo: "producto", enStock: false },
      { nombre: "Servilletas", tipo: "producto", enStock: false },
      { nombre: "Pinzas", tipo: "producto", enStock: false },
      { nombre: "Esponjas", tipo: "producto", enStock: false }
    ];

    let inventarioGuardado = JSON.parse(localStorage.getItem('miInventarioGlobal_v2'));
    let inventario = inventarioGuardado || [...listaBaseOriginal];

    let menuSemanal = JSON.parse(localStorage.getItem('miMenuSemanal')) || {};
    let filtroActual = 'todos';

    function cambiarSeccion(seccion, e) {
      document.querySelectorAll('.main-nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel-container').forEach(panel => panel.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById(seccion === 'menu' ? 'sec-menu' : 'sec-stock').classList.add('active');
    }

    function renderMenuPlanner() {
      const container = document.getElementById('menu-semanal-container');
      container.innerHTML = '';

      diasSemana.forEach(dia => {
        const almuerzoVal = menuSemanal[dia]?.almuerzo || '';
        const cenaVal = menuSemanal[dia]?.cena || '';

        const div = document.createElement('div');
        div.className = 'menu-day-row';
        div.innerHTML = `
          <label>${dia}</label>
          <div class="menu-inputs-grid">
            <input type="text" placeholder="Almuerzo (Izq.)" value="${almuerzoVal}" onchange="guardarPlato('${dia}', 'almuerzo', this.value)">
            <input type="text" placeholder="Cena (Der.)" value="${cenaVal}" onchange="guardarPlato('${dia}', 'cena', this.value)">
          </div>
        `;
        container.appendChild(div);
      });
    }

    function guardarPlato(dia, tipo, texto) {
      if (!menuSemanal[dia]) menuSemanal[dia] = {};
      menuSemanal[dia][tipo] = texto;
      localStorage.setItem('miMenuSemanal', JSON.stringify(menuSemanal));
    }

    function asignarComidaManual() {
      const input = document.getElementById('custom-comida-input');
      const comida = input.value.trim();
      const dia = document.getElementById('custom-dia-select').value;
      const momento = document.getElementById('custom-momento-select').value;

      // Si el usuario no escribió nada, se mantiene lo que estaba originalmente
      if (comida !== '') {
        guardarPlato(dia, momento, comida);
        renderMenuPlanner();
        input.value = '';
      }
    }

    function generarMenuAutomatico() {
      let bolsaAlmuerzos = [...catalogoComidas].sort(() => Math.random() - 0.5);
      let bolsaCenas = [...catalogoComidas].sort(() => Math.random() - 0.5);

      diasSemana.forEach(dia => {
        if (bolsaAlmuerzos.length === 0) bolsaAlmuerzos = [...catalogoComidas].sort(() => Math.random() - 0.5);
        if (bolsaCenas.length === 0) bolsaCenas = [...catalogoComidas].sort(() => Math.random() - 0.5);

        const almuerzoElegido = bolsaAlmuerzos.pop().nombre;
        let cenaElegida = bolsaCenas.pop().nombre;

        if (cenaElegida === almuerzoElegido && catalogoComidas.length > 1) {
          bolsaCenas.push({ nombre: cenaElegida });
          bolsaCenas.sort(() => Math.random() - 0.5);
          cenaElegida = bolsaCenas.pop().nombre;
        }

        menuSemanal[dia] = { almuerzo: almuerzoElegido, cena: cenaElegida };
      });

      localStorage.setItem('miMenuSemanal', JSON.stringify(menuSemanal));
      renderMenuPlanner();
    }

    function verificarYcargarFaltantes() {
      let agregados = 0;

      diasSemana.forEach(dia => {
        ['almuerzo', 'cena'].forEach(comida => {
          const nombrePlato = menuSemanal[dia]?.[comida];
          if (nombrePlato) {
            const receta = catalogoComidas.find(r => r.nombre.toLowerCase() === nombrePlato.toLowerCase());
            const ingredientesAProcesar = receta ? receta.ingredientes : [nombrePlato];

            ingredientesAProcesar.forEach(ing => {
              if (ing.length > 2) {
                const existe = inventario.some(item => item.nombre.toLowerCase() === ing.toLowerCase());
                if (!existe) {
                  inventario.push({ 
                    nombre: ing.charAt(0).toUpperCase() + ing.slice(1), 
                    tipo: 'alimento', 
                    enStock: false 
                  });
                  agregados++;
                }
              }
            });
          }
        });
      });

      renderInventario();
      alert(agregados > 0 ? `Se agregaron ${agregados} ingrediente(s) nuevos a la lista.` : 'Todos los ingredientes ya existen en la lista.');
    }

    function obtenerTextoMenu() {
      let texto = "📋 *MI MENÚ SEMANAL*\n\n";
      let hayMenu = false;
      diasSemana.forEach(dia => {
        const alm = menuSemanal[dia]?.almuerzo;
        const cena = menuSemanal[dia]?.cena;
        if (alm || cena) {
          hayMenu = true;
          texto += `*${dia}:*\n${alm ? '  • Almuerzo: ' + alm + '\n' : ''}${cena ? '  • Cena: ' + cena + '\n' : ''}\n`;
        }
      });
      return hayMenu ? texto : null;
    }

    function compartirPorWhatsApp() {
      const texto = obtenerTextoMenu();
      if (!texto) return alert("El menú está vacío.");
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
    }

    function copiarMenuAlPortapapeles() {
      const texto = obtenerTextoMenu();
      if (!texto) return alert("El menú está vacío.");
      navigator.clipboard.writeText(texto).then(() => alert("¡Copiado al portapapeles!"));
    }

    function renderInventario() {
      const container = document.getElementById('inventario-lista-container');
      container.innerHTML = '';

      if (filtroActual === 'falta') {
        const alimFalta = inventario.filter(i => !i.enStock && i.tipo === 'alimento');
        const prodFalta = inventario.filter(i => !i.enStock && i.tipo === 'producto');

        renderGrupo(container, '🍎 Alimentos Faltantes', alimFalta);
        renderGrupo(container, '🧼 Productos Faltantes', prodFalta);
      } else {
        let items = [...inventario];
        if (filtroActual === 'stock-alimentos') items = items.filter(i => i.enStock && i.tipo === 'alimento');
        if (filtroActual === 'stock-productos') items = items.filter(i => i.enStock && i.tipo === 'producto');
        if (filtroActual === 'todos') {
          items.sort((a, b) => (a.tipo === b.tipo ? 0 : a.tipo === 'alimento' ? -1 : 1));
        }

        renderGrupo(container, null, items);
      }

      localStorage.setItem('miInventarioGlobal_v2', JSON.stringify(inventario));
    }

    function renderGrupo(container, titulo, items) {
      if (titulo && items.length > 0) {
        const h = document.createElement('div');
        h.className = 'section-header-tag';
        h.innerText = titulo;
        container.appendChild(h);
      }

      const ul = document.createElement('ul');
      ul.className = 'item-list';

      if (items.length === 0 && !titulo) {
        ul.innerHTML = `<li style="text-align:center; color:#999; font-size:0.75rem; padding:10px;">Sin elementos</li>`;
      }

      items.forEach(item => {
        const realIndex = inventario.indexOf(item);
        const li = document.createElement('li');
        li.className = 'item-row';
        li.innerHTML = `
          <div class="item-left">
            <input type="checkbox" ${item.enStock ? 'checked' : ''} onchange="toggleEstado(${realIndex})">
            <span>${item.nombre}</span>
            <small style="font-size:0.65rem;">${item.tipo === 'alimento' ? '🍎' : '🧼'}</small>
          </div>
          <div class="item-right">
            <span class="badge ${item.enStock ? 'badge-stock' : 'badge-falta'}">${item.enStock ? 'Stock' : 'Falta'}</span>
            <button class="btn-delete" onclick="eliminarItem(${realIndex})">🗑️</button>
          </div>
        `;
        ul.appendChild(li);
      });

      container.appendChild(ul);
    }

    function toggleEstado(index) {
      inventario[index].enStock = !inventario[index].enStock;
      renderInventario();
    }

    function eliminarItem(index) {
      inventario.splice(index, 1);
      renderInventario();
    }

    function filtrarLista(filtro, e) {
      filtroActual = filtro;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      renderInventario();
    }

    function agregarItemManual() {
      const input = document.getElementById('nuevo-item-input');
      const selectTipo = document.getElementById('nuevo-item-tipo');
      const nombre = input.value.trim();

      if (nombre !== '') {
        inventario.push({ nombre: nombre, tipo: selectTipo.value, enStock: false });
        input.value = '';
        renderInventario();
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') agregarItemManual();
    }

    renderMenuPlanner();
    renderInventario();
  </script>
</body>
</html>
